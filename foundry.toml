[profile.default]
src = "assets/erc-agent-meditation/contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "./assets" },
  { access = "read", path = "./deployments" },
  { access = "read-write", path = "./deployments/anvil" },
  { access = "read-write", path = "./deployments/sepolia" },
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[lint]
exclude_lints = ["incorrect-shift"]
